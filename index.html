<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hydraulic Press vs Nokia 3310</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="c"></canvas>

  <div id="panel">
    <h1>HYDRAULIC&nbsp;PRESS<span>channel</span></h1>

    <label class="field">
      <span>Object under press</span>
      <select id="object"></select>
    </label>
    <div id="objInfo"></div>

    <label class="field">
      <span>Press capacity <b id="capVal">100 t</b></span>
      <input type="range" id="capacity" min="10" max="500" step="10" value="100" />
    </label>

    <label class="field">
      <span>Time scale <b id="tsVal">1.0×</b></span>
      <input type="range" id="timescale" min="0.1" max="2" step="0.05" value="1" />
    </label>

    <div class="row">
      <button id="go" class="primary">PRESS <kbd>Space</kbd></button>
      <button id="reset">RESET <kbd>R</kbd></button>
    </div>
    <div class="row checks">
      <label><input type="checkbox" id="sound" checked /> Sound</label>
      <label><input type="checkbox" id="autocam" checked /> Auto camera</label>
    </div>
  </div>

  <div id="status"><div class="head">READY</div><div class="sub">Pick an object and hit PRESS</div></div>

  <div id="visitors" title="Total visits"><span class="dot" aria-hidden="true"></span><span class="label">VISITS</span><span id="visitor-count" aria-live="polite">0</span></div>

  <div id="gauge"></div>
  <div id="flash"></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
